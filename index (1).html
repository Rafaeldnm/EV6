<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Investimentos Públicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .card-gradient {
            background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
        }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-orange-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Gestão Pública</h1>
            <div class="space-x-4">
                <a href="index.html" class="hover:underline"><i class="fas fa-home"></i> Dashboard</a>
                <a href="categories.html" class="hover:underline"><i class="fas fa-list"></i> Categorias</a>
                <a href="investments.html" class="hover:underline"><i class="fas fa-money-bill-wave"></i> Investimentos</a>
                <a href="charts.html" class="hover:underline"><i class="fas fa-chart-bar"></i> Gráficos</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Dashboard</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card-gradient text-white p-6 rounded-lg shadow-lg">
                <h3 class="text-xl font-semibold mb-2">Total Investido</h3>
                <p class="text-3xl font-bold" id="total-invested">R$ 0,00</p>
            </div>
            <div class="card-gradient text-white p-6 rounded-lg shadow-lg">
                <h3 class="text-xl font-semibold mb-2">Investimento Anual</h3>
                <p class="text-3xl font-bold" id="annual-invested">R$ 0,00</p>
            </div>
            <div class="card-gradient text-white p-6 rounded-lg shadow-lg">
                <h3 class="text-xl font-semibold mb-2">Categorias</h3>
                <p class="text-3xl font-bold" id="category-count">0</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h3 class="text-xl font-semibold mb-4">Últimos Investimentos</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white" id="recent-investments">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="py-2 px-4">Categoria</th>
                            <th class="py-2 px-4">Ano</th>
                        <th class="py-2 px-4">Valor Histórico</th>
                        <th class="py-2 px-4">Valor Corrigido</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filled by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="scripts/app.js"></script>
</body>
</html>
