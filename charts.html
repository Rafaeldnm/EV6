<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos - Gestão Pública</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-orange-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Gestão Pública</h1>
            <div class="space-x-4">
                <a href="index.html" class="hover:underline"><i class="fas fa-home"></i> Dashboard</a>
                <a href="categories.html" class="hover:underline"><i class="fas fa-list"></i> Categorias</a>
                <a href="investments.html" class="hover:underline"><i class="fas fa-money-bill-wave"></i> Investimentos</a>
                <a href="charts.html" class="hover:underline font-bold"><i class="fas fa-chart-bar"></i> Gráficos</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-6">Visualização de Investimentos</h2>
        
        <!-- Filters -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h3 class="text-xl font-semibold mb-4">Filtros</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-700 mb-2" for="chart-category">Categoria</label>
                    <select id="chart-category"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                        <option value="all">Todas as Categorias</option>
                        <!-- Filled by JavaScript -->
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="chart-year-start">Ano Inicial</label>
                    <input type="number" id="chart-year-start" min="2000" max="2099"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="chart-year-end">Ano Final</label>
                    <input type="number" id="chart-year-end" min="2000" max="2099"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
            </div>
            <div class="mt-4 flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-gray-700 mb-2" for="value-type">Tipo de Valor</label>
                    <select id="value-type" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500">
                        <option value="historical">Valor Histórico</option>
                        <option value="adjusted">Valor Corrigido (IPCA)</option>
                    </select>
                </div>
                <button onclick="updateCharts()" 
                    class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg">
                    <i class="fas fa-sync-alt mr-2"></i>Atualizar Gráficos
                </button>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-4">Investimento por Ano</h3>
                <canvas id="bar-chart" class="w-full h-96"></canvas>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-4">Distribuição por Categoria</h3>
                <canvas id="pie-chart" class="w-full h-96"></canvas>
            </div>
        </div>

        <!-- Export Buttons -->
        <div class="mt-6 flex space-x-4">
            <button onclick="exportChart('bar-chart')" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg">
                <i class="fas fa-download mr-2"></i>Exportar Gráfico de Barras
            </button>
            <button onclick="exportChart('pie-chart')" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg">
                <i class="fas fa-download mr-2"></i>Exportar Gráfico de Pizza
            </button>
        </div>
    </main>

    <script src="scripts/app.js"></script>
</body>
</html>
