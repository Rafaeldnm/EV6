<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Gestão Pública</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
    <nav class="bg-orange-600 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Gestão Pública</h1>
            <div class="space-x-4">
                <a href="index.html" class="hover:underline"><i class="fas fa-home"></i> Dashboard</a>
                <a href="categories.html" class="hover:underline font-bold"><i class="fas fa-list"></i> Categorias</a>
                <a href="investments.html" class="hover:underline"><i class="fas fa-money-bill-wave"></i> Investimentos</a>
                <a href="charts.html" class="hover:underline"><i class="fas fa-chart-bar"></i> Gráficos</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold">Categorias de Investimento</h2>
                <button onclick="openCategoryModal()" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg">
                <i class="fas fa-plus mr-2"></i>Nova Categoria
            </button>
        </div>

        <!-- Category Table -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <table class="min-w-full divide-y divide-gray-200" id="categories-table">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descrição</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <!-- Filled by JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Category Modal -->
    <div id="category-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="text-xl font-bold mb-4" id="modal-title">Nova Categoria</h3>
            <form id="category-form">
                <input type="hidden" id="category-id">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="category-name">Nome*</label>
                    <input type="text" id="category-name" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="category-desc">Descrição</label>
                    <textarea id="category-desc" rows="3"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeCategoryModal()"
                        class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-100">Cancelar</button>
                    <button type="submit"
                        class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
